# Runs the automated tests and a test build of the website on every change.
name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: git clone --depth 1 --branch v4.4.6 https://github.com/biolink/biolink-model /tmp/biolink-model
      - run: BIOLINK_DIR=/tmp/biolink-model python3 -m pytest -q tests
      - run: python3 site/build_site.py --config kit.tinnitus.yaml --records records/tinnitus.records.json --out public
