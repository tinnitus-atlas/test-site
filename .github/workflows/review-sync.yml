# One merge per review: when the owner edits the ticks in an open proposals pull request, the record changes for the
# ticked items are rebuilt on that pull request's branch, so merging it is what puts them live.
# Runs only for the owner's own edits (repository variable REVIEW_OWNER, default the owner account), only on proposals
# pull requests opened by the trusted bot (REVIEW_BOT) from this repository. It never touches main: the owner's merge does.
# Safety: this runs main's copy of the workflow and of the review code (pull_request_target). The pull request's branch
# is read as data only, in a separate folder; its code is never run. A review that changes anything outside reports/
# and records/ is refused.
name: Review sync
on:
  pull_request_target:
    types: [edited]
permissions:
  contents: read
  pull-requests: read
jobs:
  sync:
    # At job level, so a skipped run (for example the bot adding drafts) never cancels the owner's sync.
    concurrency:
      group: review-sync-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    if: >-
      github.event.sender.login == (vars.REVIEW_OWNER || 'varioso') &&
      startsWith(github.event.pull_request.title, 'Nightly proposals') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == (vars.REVIEW_BOT || 'varioso-bot')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      # Only the settings parser the review code needs, pinned (not the whole toolkit) while the bot key is loaded.
      - run: pip install pyyaml==6.0.2
      - name: Sync ticked items
        id: sync
        env:
          GH_TOKEN: ${{ secrets.NIGHTLY_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euo pipefail
          outside="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" -q '.[].filename' \
            | grep -vE '^(reports|records)/' || true)"
          if [ -n "$outside" ]; then
            echo "::error::This review changes files outside reports/ and records/, so it was not synced: $outside"
            echo "Not synced: the review changes files outside reports/ and records/. Merge nothing; ask for a check." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          cd main
          git -c core.hooksPath=/dev/null fetch -q --no-tags origin \
            "+refs/heads/$HEAD_REF:refs/remotes/pr/head" "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          git -c core.hooksPath=/dev/null worktree add -q --detach ../branch refs/remotes/pr/head
          cd ../branch
          if [ -n "$(find records reports -type l 2>/dev/null)" ]; then
            echo "::error::This review contains links (symlinks) under records/ or reports/, so it was not synced."
            exit 1
          fi
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json body -q .body > "$RUNNER_TEMP/body.md"
          today="$(date -u +%Y-%m-%d)"
          push() {
            git -c core.hooksPath=/dev/null -c http.https://github.com/.extraheader="$auth" push -q origin "HEAD:refs/heads/$HEAD_REF"
          }
          # Main's review code and settings; the branch supplies only its proposals and records as data.
          if ! python3 -I -c 'import sys; sys.path.insert(0, sys.argv[1]); from kgkit import review; sys.exit(review.main(sys.argv[2:]))' \
            "$GITHUB_WORKSPACE/main" sync --config "$GITHUB_WORKSPACE/main/kit.tinnitus.yaml" \
            --records records/tinnitus.records.json --pr "$PR_NUMBER" --body-file "$RUNNER_TEMP/body.md" \
            --proposals reports/proposals.json --base "origin/$DEFAULT_BRANCH" --today "$today"; then
            # Never leave an earlier tick state behind: reset the records to main, so the ticked items are applied by
            # the nightly after the merge instead.
            rm -f records/applied_prs.json records/seen_proposals.json records/decisions.jsonl records/parked.json records/review_queue.json
            git checkout "origin/$DEFAULT_BRANCH" -- records
            if [ -n "$(git status --porcelain -- records)" ]; then
              git add -A -- records
              git -c core.hooksPath=/dev/null -c user.name="kg-nightly" -c user.email="kg-nightly@users.noreply.github.com" \
                commit -q -m "Records reset: the sync failed; ticked items are applied after the merge"
              push
            fi
            echo "Sync failed: the records on this review were reset to main; ticked items are applied by the nightly after the merge." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ -n "$(git status --porcelain -- records)" ]; then
            git add -A -- records
            git -c core.hooksPath=/dev/null -c user.name="kg-nightly" -c user.email="kg-nightly@users.noreply.github.com" \
              commit -q -m "Ticked items ready to go live with the merge ($today)"
            push
            echo "Record changes updated for the ticked items." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No change: the ticked items were already in place." >> "$GITHUB_STEP_SUMMARY"
          fi
