# Backfill: proposes older trials, papers and FDA device decisions in a pull request titled
# "Nightly proposals backfill <since>-<until> days ...", so the existing approval and apply steps handle it unchanged.
# Stages run themselves (kgkit/backfill_plan.py): 183-30 days (pilot), then 365-183, then 730-365, each starting when
# a review is merged and the previous stage was merged. Started by hand, it uses the window given.
# Repository variable BACKFILL_AUTO=off stops the chain.
name: Backfill
on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      since_days:
        description: "Oldest edge of the window, in days back"
        default: "183"
      until_days:
        description: "Newest edge of the window, in days back (30 = where the nightly stops)"
        default: "30"
      paper_cap:
        description: "Most papers to propose (the rest are queued)"
        default: "30"
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: nightly
  cancel-in-progress: false
jobs:
  backfill:
    # Automatic start: only after a review pull request was merged. Nothing from the pull request is checked out.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true && startsWith(github.event.pull_request.title, 'Nightly proposals'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.NIGHTLY_TOKEN || github.token }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Pick the window
        id: plan
        env:
          GH_TOKEN: ${{ secrets.NIGHTLY_TOKEN || github.token }}
          BACKFILL_AUTO: ${{ vars.BACKFILL_AUTO }}
          EVENT: ${{ github.event_name }}
          SINCE_IN: ${{ inputs.since_days }}
          UNTIL_IN: ${{ inputs.until_days }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "since=${SINCE_IN:-183}" >> "$GITHUB_OUTPUT"
            echo "until=${UNTIL_IN:-30}" >> "$GITHUB_OUTPUT"
          else
            python3 -m kgkit.backfill_plan | tee -a "$GITHUB_OUTPUT"
          fi
      - name: Backfill
        id: backfill
        if: steps.plan.outputs.since != ''
        env:
          GH_TOKEN: ${{ secrets.NIGHTLY_TOKEN || github.token }}
          SINCE_DAYS: ${{ steps.plan.outputs.since }}
          UNTIL_DAYS: ${{ steps.plan.outputs.until }}
          PAPER_CAP: ${{ inputs.paper_cap }}
        run: |
          git config user.name "kg-nightly"
          git config user.email "kg-nightly@users.noreply.github.com"
          chmod +x run_backfill.sh
          ./run_backfill.sh "${SINCE_DAYS:-183}" "${UNTIL_DAYS:-30}" "${PAPER_CAP:-30}" >> "$GITHUB_STEP_SUMMARY"
